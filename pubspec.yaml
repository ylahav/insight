name: insight_workspace
publish_to: none
environment:
  sdk: ^3.12.2

workspace:
  - packages/insight
  - packages/insight_bloc
  - packages/insight_riverpod
  - packages/insight_collector
  - packages/insight_cli
  - packages/insight_devtools
  - examples/bloc_counter
  - tool/analyzer
  - examples/desk
  - examples/exchange
  - examples/exchange2/rules
  - examples/exchange2/agent
  - examples/exchange2/switch
  - examples/exchange2/phone
