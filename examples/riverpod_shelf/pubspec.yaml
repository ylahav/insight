name: riverpod_shelf
description: Two Riverpod trees that show what Flutter Insight lines up.
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  insight:
    path: ../../packages/insight
  insight_riverpod:
    path: ../../packages/insight_riverpod

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
